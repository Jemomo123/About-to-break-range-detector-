<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Version 1.0 Market Scanner</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 20px;
        }
        h2 {
            color: #ffffff;
            margin-bottom: 15px;
        }
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1e1e1e;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #2c2c2c;
        }
        th {
            background-color: #252525;
            color: #b0b0b0;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
        }
        tr:hover {
            background-color: #2a2a2a;
        }
        .symbol {
            font-weight: bold;
            color: #ffffff;
        }
        .evidence {
            font-family: monospace;
            font-size: 0.9rem;
            color: #888888;
        }
    </style>
</head>
<body>

    <h2>Market Scanner — Version 1.0</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>SYMBOL</th>
                    <th>TIMEFRAME</th>
                    <th>STATUS</th>
                    <th>BATTLE</th>
                    <th>LOCATION</th>
                    <th>BREAKOUT READINESS</th>
                    <th>EVIDENCE</th>
                </tr>
            </thead>
            <tbody id="scanner-table-body">
                {% for row in rows %}
                <tr>
                    <td class="symbol">{{ row['SYMBOL'] }}</td>
                    <td>{{ row['TIMEFRAME'] }}</td>
                    <td>{{ row['STATUS'] }}</td>
                    <td>{{ row['BATTLE'] }}</td>
                    <td>{{ row['LOCATION'] }}</td>
                    <td>{{ row['BREAKOUT READINESS'] }}</td>
                    <td class="evidence">{{ row['EVIDENCE'] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</body>
</html>
