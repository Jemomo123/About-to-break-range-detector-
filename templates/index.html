<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institutional Range & Breakout Scanner</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #121318; color: #e1e3e6; margin: 0; padding: 15px; }
        h1 { color: #f0b90b; font-size: 1.5rem; text-align: center; }
        .card { background-color: #1e2026; border: 1px solid #2b2f36; border-radius: 8px; padding: 15px; margin-bottom: 12px; }
        .flex { display: flex; justify-content: space-between; align-items: center; }
        .symbol { font-weight: bold; font-size: 1.2rem; }
        .badge { background: #2b2f36; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; color: #848e9c; }
        .UPSIDE { color: #0ecb81; font-weight: bold; }
        .DOWNSIDE { color: #f6465d; font-weight: bold; }
        .bar-container { background: #2b2f36; height: 8px; border-radius: 4px; overflow: hidden; margin: 8px 0; }
        .bar-fill { background: #f0b90b; height: 100%; }
        .text-sm { font-size: 0.85rem; color: #848e9c; }
    </style>
</head>
<body>

    <h1>About To Break Scanner</h1>
    <div id="results">Loading live market scan...</div>

    <script>
        async function fetchScanData() {
            try {
                const response = await fetch('/api/scan');
                const result = await response.json();
                const container = document.getElementById('results');
                
                if (!result.data || result.data.length === 0) {
                    container.innerHTML = '<p style="text-align:center;">No active ranges detected.</p>';
                    return;
                }

                container.innerHTML = '';
                result.data.forEach(item => {
                    container.innerHTML += `
                        <div class="card">
                            <div class="flex">
                                <span class="symbol">${item.symbol}</span>
                                <span class="badge">${item.range_type}</span>
                            </div>
                            <div class="flex" style="margin-top: 8px;">
                                <span class="text-sm">Price: <strong>${item.current_price}</strong></span>
                                <span class="${item.direction}">${item.status}</span>
                            </div>
                            <div class="bar-container">
                                <div class="bar-fill" style="width: ${item.price_location_pct}%;"></div>
                            </div>
                            <div class="flex text-sm">
                                <span>Support: ${item.support}</span>
                                <span>Resistance: ${item.resistance}</span>
                            </div>
                            <div class="flex text-sm" style="margin-top: 6px;">
                                <span>Buyer Power: ${item.buyer_power}%</span>
                                <span>Seller Power: ${item.seller_power}%</span>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                document.getElementById('results').innerHTML = '<p style="text-align:center; color:#f6465d;">Failed to load data.</p>';
            }
        }

        fetchScanData();
        setInterval(fetchScanData, 15000); // Auto refresh every 15s
    </script>
</body>
</html>
