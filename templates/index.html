<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About To Break Scanner</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background-color: #121318; 
            color: #e1e3e6; 
            margin: 0; 
            padding: 12px; 
        }
        h1 { 
            color: #f0b90b; 
            font-size: 1.4rem; 
            text-align: center; 
            margin-bottom: 16px;
        }
        .card { 
            background-color: #1e2026; 
            border: 1px solid #2b2f36; 
            border-radius: 8px; 
            padding: 14px; 
            margin-bottom: 12px; 
        }
        .flex { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 8px;
        }
        .symbol { 
            font-weight: 700; 
            font-size: 1.25rem; 
            letter-spacing: 0.5px;
        }
        .badge { 
            background: #2b2f36; 
            padding: 3px 8px; 
            border-radius: 4px; 
            font-size: 0.75rem; 
            color: #848e9c; 
            font-weight: 600;
        }
        .UPSIDE { 
            color: #0ecb81; 
            font-weight: 700; 
            font-size: 0.95rem;
        }
        .DOWNSIDE { 
            color: #f6465d; 
            font-weight: 700; 
            font-size: 0.95rem;
        }
        .bar-container { 
            background: #2b2f36; 
            height: 8px; 
            border-radius: 4px; 
            overflow: hidden; 
            margin: 10px 0; 
        }
        .bar-fill { 
            background: #f0b90b; 
            height: 100%; 
            transition: width 0.3s ease;
        }
        .text-sm { 
            font-size: 0.85rem; 
            color: #848e9c; 
        }
        .val {
            color: #e1e3e6;
            font-weight: 600;
        }
        .grid-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <h1>About To Break Scanner</h1>
    <div id="results">Loading live market scan...</div>

    <script>
        async function fetchScanData() {
            try {
                const response = await fetch('/api/scan');
                const result = await response.json();
                const container = document.getElementById('results');
                
                if (!result.data || result.data.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#848e9c;">No active ranges detected.</p>';
                    return;
                }

                container.innerHTML = '';
                result.data.forEach(item => {
                    container.innerHTML += `
                        <div class="card">
                            <div class="flex">
                                <span class="symbol">${item.symbol}</span>
                                <span class="badge">${item.range_type}</span>
                            </div>
                            
                            <div class="flex" style="margin-top: 8px;">
                                <span class="text-sm">Price: <span class="val">${item.current_price}</span></span>
                                <span class="${item.direction}">${item.status}</span>
                            </div>
                            
                            <div class="bar-container">
                                <div class="bar-fill" style="width: ${item.price_location_pct}%;"></div>
                            </div>
                            
                            <div class="grid-row text-sm">
                                <span>Support: <span class="val">${item.support}</span></span>
                                <span>Resistance: <span class="val">${item.resistance}</span></span>
                            </div>
                            
                            <div class="grid-row text-sm">
                                <span>Buyer Power: <span class="val">${item.buyer_power}%</span></span>
                                <span>Seller Power: <span class="val">${item.seller_power}%</span></span>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                document.getElementById('results').innerHTML = '<p style="text-align:center; color:#f6465d;">Failed to load data.</p>';
            }
        }

        fetchScanData();
        setInterval(fetchScanData, 15000); // Auto refresh every 15 seconds
    </script>
</body>
</html>
