<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About To Break — Range Scanner — Version 1.2</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 12px;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        h2 {
            color: #ffffff;
            margin: 0;
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.25;
        }
        .timestamp {
            font-size: 0.75rem;
            color: #888888;
            background-color: #1e1e1e;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #2c2c2c;
        }

        /* Timeframe Selector Toolbar Controls */
        .tf-toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
            background-color: #1e1e1e;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #2c2c2c;
            width: fit-content;
        }
        .tf-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #888888;
            margin-right: 4px;
        }
        .tf-btn {
            background-color: #151515;
            color: #aaaaaa;
            border: 1px solid #2c2c2c;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
        }
        .tf-btn:hover {
            background-color: #242424;
            color: #ffffff;
        }
        .tf-btn.active {
            background-color: #00e676;
            color: #121212;
            border-color: #00e676;
        }

        .table-container {
            overflow-x: auto;
            max-height: 85vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            border: 1px solid #2c2c2c;
            border-radius: 6px;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background-color: #1e1e1e;
            font-size: 0.85rem;
        }
        th, td {
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid #2c2c2c;
            white-space: nowrap;
        }
        /* Sticky Table Header */
        th {
            background-color: #252525;
            color: #888888;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        /* Sticky SYMBOL Column (First Column) */
        th:first-child, td:first-child {
            position: sticky;
            left: 0;
            z-index: 5;
            box-shadow: 2px 0 5px rgba(0,0,0,0.4);
        }
        th:first-child {
            z-index: 15;
            background-color: #252525;
        }
        /* Zebra Striping */
        tbody tr:nth-child(odd) td {
            background-color: #1a1a1a;
        }
        tbody tr:nth-child(even) td {
            background-color: #151515;
        }
        tbody tr:hover td {
            background-color: #242424 !important;
        }
        
        .symbol {
            font-weight: 700;
            color: #00e676;
        }

        /* Trader-Friendly Evidence Styling */
        .evidence-cell {
            white-space: pre-line;
            line-height: 1.45;
            font-size: 0.8rem;
            color: #d1d1d1;
            min-width: 240px;
        }

        /* Badges & Dynamic Colors */
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.75rem;
        }
        .badge-timeframe {
            background-color: #2c2c2c;
            color: #cccccc;
        }
        
        /* Compact Status Color-Coding (Updated to match Version 1.2 app.py) */
        .status-high-comp {
            background-color: rgba(255, 23, 68, 0.15);
            color: #ff4081;
            border: 1px solid rgba(255, 23, 68, 0.3);
        }
        .status-comp {
            background-color: rgba(255, 145, 0, 0.15);
            color: #ffab40;
            border: 1px solid rgba(255, 145, 0, 0.3);
        }
        .status-loose-comp {
            background-color: #2c2c2c;
            color: #aaaaaa;
        }

        /* Battle State Color-Coding */
        .battle-bulls { color: #00e676; font-weight: 600; }
        .battle-bears { color: #ff5252; font-weight: 600; }
        .battle-balanced { color: #e0e0e0; font-weight: 500; }

        /* Breakout Readiness Color-Coding */
        .readiness-high { color: #00e676; font-weight: 700; }
        .readiness-med { color: #ffab40; font-weight: 700; }
        .readiness-low { color: #888888; font-weight: 400; }
    </style>
</head>
<body>

    <div class="header-container">
        <h2>About To Break<br>Range Scanner — Version 1.2</h2>
        <div class="timestamp">Last Updated: <span id="update-time">--:--:-- UTC</span></div>
    </div>

    <!-- Timeframe Selector Toolbar (Default: 5m) -->
    <div class="tf-toolbar">
        <span class="tf-label">Timeframe:</span>
        <button class="tf-btn" data-tf="2m" onclick="selectTimeframe('2m')">2m</button>
        <button class="tf-btn active" data-tf="5m" onclick="selectTimeframe('5m')">5m</button>
        <button class="tf-btn" data-tf="15m" onclick="selectTimeframe('15m')">15m</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>SYMBOL</th>
                    <th>TIMEFRAME</th>
                    <th>STATUS</th>
                    <th>BATTLE</th>
                    <th>LOCATION</th>
                    <th>BREAKOUT READINESS</th>
                    <th>EVIDENCE</th>
                </tr>
            </thead>
            <tbody id="scanner-tbody">
                <!-- Data populated dynamically via API -->
            </tbody>
        </table>
    </div>

    <script>
        let selectedTimeframe = '5m';

        function updateTimestamp() {
            document.getElementById('update-time').innerText = new Date().toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
        }

        function selectTimeframe(tf) {
            if (selectedTimeframe === tf) return;
            selectedTimeframe = tf;

            // Toggle active toolbar button state
            document.querySelectorAll('.tf-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tf === tf);
            });

            // Refresh scanner data without page reload
            fetchScanData();
        }

        async function fetchScanData() {
            try {
                const response = await fetch(`/api/scan?timeframe=${selectedTimeframe}`);
                const data = await response.json();
                renderTable(data.results);
                updateTimestamp();
            } catch (error) {
                console.error("Failed to update scanner data:", error);
            }
        }

        function renderTable(rows) {
            const tbody = document.getElementById('scanner-tbody');
            tbody.innerHTML = '';

            if (!rows || rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #888;">No scanner data available</td></tr>`;
                return;
            }

            rows.forEach(row => {
                const tr = document.createElement('tr');

                // Status Badge Helper
                let statusBadgeClass = 'status-loose-comp';
                if (row.status.includes('HIGH COMP')) {
                    statusBadgeClass = 'status-high-comp';
                } else if (row.status.includes('COMP')) {
                    statusBadgeClass = 'status-comp';
                }

                // Battle Style Helper
                let battleClass = 'battle-balanced';
                const battleUpper = (row.battle || '').toUpperCase();
                if (battleUpper.includes('BULL')) {
                    battleClass = 'battle-bulls';
                } else if (battleUpper.includes('BEAR')) {
                    battleClass = 'battle-bears';
                }

                // Breakout Readiness Style Helper
                let readinessClass = 'readiness-low';
                const readinessUpper = (row.readiness || '').toUpperCase();
                if (readinessUpper.includes('IMMINENT') || readinessUpper.includes('READY')) {
                    readinessClass = 'readiness-high';
                } else if (readinessUpper.includes('BUILDING')) {
                    readinessClass = 'readiness-med';
                }

                tr.innerHTML = `
                    <td class="symbol">${row.symbol}</td>
                    <td><span class="badge badge-timeframe">${row.timeframe}</span></td>
                    <td><span class="badge ${statusBadgeClass}">${row.status}</span></td>
                    <td><span class="${battleClass}">${row.battle}</span></td>
                    <td>${row.location}</td>
                    <td><span class="${readinessClass}">${row.readiness}</span></td>
                    <td class="evidence-cell">${row.evidence}</td>
                `;

                tbody.appendChild(tr);
            });
        }

        // Initial fetch on page load (Default 5m)
        fetchScanData();
    </script>
</body>
</html>
