<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range Detector - Diagnostic Pipeline</title>
    <style>
        body { background: #0b0e14; color: #e0e0e0; font-family: sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .status-box { border: 1px solid #222; padding: 15px; border-radius: 6px; background: #0f1219; margin: 15px 0; }
        .diagnostic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; font-family: monospace; font-size: 0.95em; }
        .diag-item { background: #161b22; padding: 8px; border-radius: 4px; border-left: 3px solid #555; }
        .diag-item.pass { border-left-color: #00c853; color: #00c853; }
        .diag-item.fail { border-left-color: #ff1744; color: #ff1744; }
        .diag-item.neutral { border-left-color: #fbbf24; color: #fbbf24; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-weight: bold; }
        .status-fetching { background: #2d3748; color: #fbbf24; }
        .status-validated { background: #1e3a3a; color: #00c853; }
        .status-error { background: #3a1e1e; color: #ff1744; }
        #debug-table-container { overflow-x: auto; margin-top: 20px; min-height: 50px; }
        .raw-table { width: 100%; border-collapse: collapse; font-size: 0.75em; }
        .raw-table td, .raw-table th { padding: 6px; border-bottom: 1px solid #222; text-align: left; }
        .raw-table th { color: #888; }
        .qualified-yes { color: #00c853; }
        .qualified-no { color: #ff1744; }
        .fetch-error { color: #ff1744; }
        .card { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📊 Range Detector</h2>
        <p style="color: #888; font-size: 0.9em;">PURE DATA FLOW DIAGNOSTIC - Pipeline Viewer</p>
        
        <div id="status-header" class="status-box">
            <div>
                <strong>Pipeline Status:</strong> 
                <span id="app-state" class="status-badge status-fetching">FETCHING</span>
            </div>
            <div style="font-size: 0.85em; color: #888; margin-top: 5px;" id="progress-text">Initializing diagnostic...</div>

            <div id="diagnostic-grid" class="diagnostic-grid" style="display: none;">
                <div id="diag-fetch" class="diag-item neutral">OKX FETCH: 0/25</div>
                <div id="diag-calc" class="diag-item neutral">CALCULATIONS: 0/25</div>
                <div id="diag-records" class="diag-item neutral">DEBUG RECORDS: 0/25</div>
                <div id="diag-rendered" class="diag-item neutral">DEBUG ROWS RENDERED: 0/25</div>
            </div>
        </div>

        <h3 style="color: #aaa; margin-top: 20px;">DEBUG: Exact Raw Values for All 25 Symbols</h3>
        <div id="debug-table-container">
            <div style="color: #666; font-size: 0.9em;">Waiting for data...</div>
        </div>
    </div>

    <script>
        const SYMBOLS = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "PEPEUSDT", "BONKUSDT", "SHIBUSDT", "USELESSUSDT", "SPACEUSDT", "MOVEUSDT", "ZECUSDT", "SPXUSDT", "PEOPLEUSDT", "PENGUUSDT", "FARTCOINUSDT", "LINEAUSDT", "MEMEUSDT", "PUMPUSDT", "AIXBTUSDT", "BRETTUSDT", "FOGOUSDT", "GOOGLUSDT", "FLOKIUSDT", "IWMUSDT", "MOODENGUSDT", "NEARUSDT"];
        const TF = "15m";
        const MIN_RANGE_THRESHOLD_PCT = 0.5; 

        function updateState(state, msg) {
            const appState = document.getElementById('app-state');
            const progress = document.getElementById('progress-text');
            appState.innerText = state;
            if(state === 'FETCHING') appState.className = 'status-badge status-fetching';
            else if (state === 'VALIDATED') appState.className = 'status-badge status-validated';
            else if (state === 'ERROR') appState.className = 'status-badge status-error';
            progress.innerText = msg;
        }

        function updateCounter(id, count, total, status) {
            const el = document.getElementById(id);
            el.innerText = el.innerText.replace(/[0-9]+\/[0-9]+/, `${count}/${total}`);
            el.className = `diag-item ${status}`;
        }

        async function fetchOKX(symbol) {
            const clean = symbol.replace("USDT", "-USDT");
            const url = `https://www.okx.com/api/v5/market/candles?instId=${clean}&bar=${TF}&limit=30`;
            try {
                const resp = await fetch(url);
                const data = await resp.json();
                if (data.code === "0" && data.data.length > 0) {
                    return data.data.map(c => ({
                        time: c[0], open: parseFloat(c[1]), high: parseFloat(c[2]),
                        low: parseFloat(c[3]), close: parseFloat(c[4]), vol: parseFloat(c[5])
                    }));
                } else return { error: `OKX API Error: ${data.code}` };
            } catch (e) { return { error: `FETCH EXCEPTION: ${e.message}` }; }
        }

        function analyze(candles, symbol) {
            if (!candles || candles.error) {
                return { symbol, state: "FAILED", rejection_reason: candles ? candles.error : "DATA ERROR", current: 0, res: 0, sup: 0 };
            }
            if (candles.length < 20) {
                return { symbol, state: "FAILED", rejection_reason: "Not enough candles (min 20)", current: candles[candles.length-1].close, res: 0, sup: 0 };
            }

            const highs = candles.map(c => c.high);
            const lows = candles.map(c => c.low);
            const raw_resistance = Math.max(...highs);
            const raw_support = Math.min(...lows);
            const raw_current = candles[candles.length - 1].close;
            const raw_range = raw_resistance - raw_support;
            
            if (raw_range <= 0) {
                return { symbol, state: "FAILED", rejection_reason: "Range width is 0 or negative", current: raw_current, res: raw_resistance, sup: raw_support };
            }

            const raw_range_width_pct = (raw_range / raw_current) * 100;
            if (raw_range_width_pct < MIN_RANGE_THRESHOLD_PCT) {
                return { symbol, state: "FAILED", rejection_reason: `Range too narrow (${raw_range_width_pct.toFixed(3)}% < ${MIN_RANGE_THRESHOLD_PCT}% threshold)`, current: raw_current, res: raw_resistance, sup: raw_support, rangeWidthPct: raw_range_width_pct.toFixed(3) };
            }

            const distRes_raw = ((raw_resistance - raw_current) / raw_current) * 100;
            const distSup_raw = ((raw_current - raw_support) / raw_current) * 100;
            
            let buyVol = 0, sellVol = 0, totalVol = 0;
            candles.slice(-10).forEach(c => {
                const volRange = c.high - c.low;
                const bRatio = volRange > 0 ? (c.close - c.low) / volRange : 0.5;
                buyVol += c.vol * bRatio;
                sellVol += c.vol * (1 - bRatio);
                totalVol += c.vol;
            });
            const buyPct = totalVol > 0 ? (buyVol / totalVol * 100) : 50;
            const sellPct = 100 - buyPct;

            let direction = "NEUTRAL", final_signal = "Consolidating", price_pos = "Middle of Range";
            if (distRes_raw < 2.0 && buyPct > 50) {
                direction = "BULLISH"; final_signal = "About to Break RANGE UP"; price_pos = "At Resistance";
            } else if (distSup_raw < 2.0 && sellPct > 50) {
                direction = "BEARISH"; final_signal = "About to Break RANGE DOWN"; price_pos = "At Support";
            } else if (distRes_raw < distSup_raw) {
                direction = "BULLISH"; final_signal = "Approaching Resistance"; price_pos = "Upper Range";
            } else if (distSup_raw < distRes_raw) {
                direction = "BEARISH"; final_signal = "Approaching Support"; price_pos = "Lower Range";
            }

            return {
                symbol, state: "QUALIFIED", rejection_reason: "N/A",
                current: raw_current, resistance: raw_resistance, support: raw_support,
                distRes: distRes_raw, distSup: distSup_raw,
                rangeWidthPct: raw_range_width_pct,
                thresholdPct: MIN_RANGE_THRESHOLD_PCT,
                buyPct: buyPct, sellPct: sellPct,
                direction, final_signal, price_pos
            };
        }

        async function loadAll() {
            document.getElementById('diagnostic-grid').style.display = 'grid';
            updateCounter('diag-fetch', 0, 25, 'neutral');
            updateCounter('diag-calc', 0, 25, 'neutral');
            updateCounter('diag-records', 0, 25, 'neutral');
            updateCounter('diag-rendered', 0, 25, 'neutral');
            updateState('FETCHING', 'Scanning OKX for 25 symbols...');
            
            let fetchSuccess = 0, calcSuccess = 0;
            const allData = [];

            for (let i = 0; i < SYMBOLS.length; i++) {
                const candles = await fetchOKX(SYMBOLS[i]);
                if (!candles || candles.error) updateCounter('diag-fetch', fetchSuccess, 25, 'fail');
                else { fetchSuccess++; updateCounter('diag-fetch', fetchSuccess, 25, 'pass'); }

                const result = analyze(candles, SYMBOLS[i]);
                allData.push(result);
                
                if (result && result.current !== undefined) { calcSuccess++; updateCounter('diag-calc', calcSuccess, 25, 'pass'); } 
                else updateCounter('diag-calc', calcSuccess, 25, 'fail');
                updateState('FETCHING', `Processing ${i+1}/25 symbols...`);
            }

            const totalRecords = allData.length;
            if (totalRecords === 25) updateCounter('diag-records', totalRecords, 25, 'pass');
            else updateCounter('diag-records', totalRecords, 25, 'fail');

            const container = document.getElementById("debug-table-container");
            let html = `<table class="raw-table"><tr><th>Symbol</th><th>TF</th><th>State</th><th>Raw Price</th><th>Sup</th><th>Res</th><th>Range%</th><th>Thresh</th><th>Qual</th><th>Reason</th></tr>`;
            allData.forEach(d => {
                const stateClass = d.state === 'QUALIFIED' ? 'qualified-yes' : d.state === 'FAILED' ? 'qualified-no' : 'fetch-error';
                const displayPrice = d.current < 0.01 ? d.current.toFixed(8) : d.current.toFixed(4);
                const displaySup = d.support < 0.01 ? d.support.toFixed(8) : d.support.toFixed(4);
                const displayRes = d.resistance < 0.01 ? d.resistance.toFixed(8) : d.resistance.toFixed(4);
                html += `<tr>
                    <td><strong>${d.symbol}</strong></td><td>${TF}</td><td class="${stateClass}">${d.state}</td>
                    <td>${displayPrice}</td><td>${displaySup}</td><td>${displayRes}</td>
                    <td><strong>${(d.rangeWidthPct || 0).toFixed(3)}%</strong></td>
                    <td>${d.thresholdPct || 0.5}%</td>
                    <td class="${stateClass}">${d.state === 'QUALIFIED' ? "YES" : "NO"}</td>
                    <td style="font-size:0.85em; color:#888;">${d.rejection_reason}</td>
                </tr>`;
            });
            html += `</table>`;
            container.innerHTML = html;

            // THE FIX: Delay the state check by 150ms to let the mobile DOM render the HTML table!
            setTimeout(() => {
                const tableRows = container.querySelectorAll('table tbody tr') || container.querySelectorAll('table tr');
                const rowsFound = tableRows.length > 0 ? tableRows.length - 1 : 0;

                if (rowsFound === 25) {
                    updateCounter('diag-rendered', rowsFound, 25, 'pass');
                    updateState('VALIDATED', 'Diagnostic pipeline completed successfully.');
                } else {
                    updateCounter('diag-rendered', rowsFound, 25, 'fail');
                    updateState('ERROR', `Render Failure: DOM injected ${rowsFound} rows.`);
                }
            }, 150); // 150 millisecond pause for painting
        }

        loadAll();
    </script>
</body>
</html>
