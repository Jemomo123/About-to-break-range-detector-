<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Dashboard</title>
  <style>
    body {
      background-color: #12161f;
      color: #eaecef;
      font-family: sans-serif;
      padding: 15px;
      text-align: center;
    }
    .card {
      background: #1e232d;
      border-radius: 8px;
      padding: 15px;
      margin: 10px 0;
      border: 1px solid #2b313a;
    }
    .symbol { font-weight: bold; font-size: 1.2rem; }
    .price { font-size: 1.4rem; font-weight: bold; margin-top: 5px; }
    .up { color: #0ecb81; }
    .down { color: #f6465d; }
  </style>
</head>
<body>

  <h2>Live Market Tracker</h2>
  <div id="ticker-container"></div>

  <script>
    const symbols = ['btcusdt', 'ethusdt', 'dogeusdt', 'shibusdt', 'wifusdt'];
    const container = document.getElementById('ticker-container');

    symbols.forEach(sym => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="symbol">${sym.toUpperCase()}</div>
        <div class="price" id="price-${sym}">Loading...</div>
      `;
      container.appendChild(card);
    });

    const ws = new WebSocket(`wss://fstream.binance.com/ws/` + symbols.map(s => `${s}@ticker`).join('/'));

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data && data.s && data.c) {
        const sym = data.s.toLowerCase();
        const priceEl = document.getElementById(`price-${sym}`);
        if (priceEl) {
          const currentPrice = parseFloat(data.c);
          const priceChange = parseFloat(data.p);
          priceEl.textContent = `$${currentPrice.toLocaleString()}`;
          priceEl.className = `price ${priceChange >= 0 ? 'up' : 'down'}`;
        }
      }
    };
  </script>
</body>
</html>
